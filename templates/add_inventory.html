{% extends 'base.html' %}{% block title %}Adjust Inventory · LifeLine{% endblock %}{% block content %}
<section class="page-heading"><div><p class="eyebrow">STOCK CORRECTION</p><h1>Adjust inventory</h1><p class="muted">Record a positive addition or a negative reduction.</p></div><a class="button quiet" href="{{ url_for('inventory') }}">← Back to inventory</a></section><form class="panel form-panel narrow" method="post"><div class="form-grid"><label>Blood group <span class="required">*</span><select name="blood_group" required><option value="">Select blood group</option>{% for group in groups %}<option>{{ group }}</option>{% endfor %}</select></label><label>Units to add or remove <span class="required">*</span><input type="number" name="units" step="1" required placeholder="e.g. 3 or -2"><small class="field-hint">Use a positive number to add stock and a negative number to remove it.</small></label></div><div class="form-note">Inventory cannot be reduced below zero.</div><div class="form-actions"><a class="button quiet" href="{{ url_for('inventory') }}">Cancel</a><button class="button primary" type="submit">Apply Adjustment</button></div></form>{% endblock %}
