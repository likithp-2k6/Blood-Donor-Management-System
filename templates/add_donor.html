{% extends 'base.html' %}{% block title %}{{ title }} · LifeLine{% endblock %}{% block content %}
<section class="page-heading"><div><p class="eyebrow">DONOR RECORD</p><h1>{{ title }}</h1><p class="muted">Enter the donor's contact and blood group details.</p></div><a class="button quiet" href="{{ url_for('donors') }}">← Back to donors</a></section>
<form class="panel form-panel" method="post"><div class="form-grid"><label>Full name <span class="required">*</span><input name="name" value="{{ donor.name or '' }}" required maxlength="100" autocomplete="name"></label><label>Age <span class="required">*</span><input name="age" type="number" min="18" max="65" value="{{ donor.age or '' }}" required></label><label>Gender <span class="required">*</span><select name="gender" required><option value="">Select gender</option>{% for gender in genders %}<option {% if donor.gender == gender %}selected{% endif %}>{{ gender }}</option>{% endfor %}</select></label><label>Blood group <span class="required">*</span><select name="blood_group" required><option value="">Select blood group</option>{% for group in groups %}<option {% if donor.blood_group == group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label><label>Phone <span class="required">*</span><input name="phone" value="{{ donor.phone or '' }}" required maxlength="30" autocomplete="tel"></label><label>Email <span class="optional">Optional</span><input name="email" type="email" value="{{ donor.email or '' }}" maxlength="120" autocomplete="email"></label><label class="span-two">Address <span class="required">*</span><textarea name="address" rows="3" required maxlength="300">{{ donor.address or '' }}</textarea></label><label>Last donation date <span class="optional">Optional</span><input name="last_donation_date" type="date" max="{{ today|default('') }}" value="{{ donor.last_donation_date or '' }}"></label></div><div class="form-note">Donors must be 18–65 years old. Eligibility follows the project's 90-day rule.</div><div class="form-actions"><a class="button quiet" href="{{ url_for('donors') }}">Cancel</a><button class="button primary" type="submit">Save Donor</button></div></form>{% endblock %}
